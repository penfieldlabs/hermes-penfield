name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # Weekly, so a change in Hermes Agent's main branch that breaks the
    # plugin shows up here within seven days.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff
        run: make lint

      - name: Mypy
        run: make typecheck

  # Unit tests: no Hermes install needed. Hermes Agent itself runs on 3.14;
  # the older versions cover installs that have not moved yet.
  unit:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Unit tests with coverage gate
        run: make test

  # The plugin inside a real Hermes Agent: the oldest supported release, two
  # later ones and the current main branch, in both plugin isolation modes.
  hermes:
    name: hermes (${{ matrix.hermes }})
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        hermes: ["v0.21.6", "v0.22.7", "v0.23.0", "main"]
    env:
      HERMES_PENFIELD_REQUIRE_HERMES: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          path: plugin
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.hermes }}
          path: hermes-agent
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          activate-environment: true
          enable-cache: true

      # Run from inside the checkout so Hermes's own dependency overrides apply.
      - name: Install Hermes Agent
        working-directory: hermes-agent
        run: uv pip install -e .

      - name: Install test tools
        run: uv pip install -r plugin/requirements-dev.txt

      - name: Hermes version
        run: hermes --version

      - name: Integration tests
        working-directory: plugin
        run: make test-hermes

  # Live round trip against the Penfield dev API. Runs only where the
  # repository has opted in and holds a dev API key.
  live:
    needs: lint
    if: ${{ vars.RUN_INTEGRATION == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PENFIELD_ENV: dev
      PENFIELD_API_KEY: ${{ secrets.PENFIELD_DEV_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Live API tests
        run: pytest -m integration --no-cov

  version-tag-guard:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Tag matches the declared version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="$(sed -n 's/^version: *//p' plugin.yaml)"
          if [ "$TAG" != "v${VERSION}" ]; then
            echo "::error::Tag '$TAG' does not match plugin.yaml version '$VERSION' (expected 'v${VERSION}')"
            exit 1
          fi
          echo "Tag '$TAG' matches plugin.yaml version '$VERSION'."
