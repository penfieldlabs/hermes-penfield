name: penfield
version: 0.3.3
description: "Penfield persistent memory for Hermes Agent: a cross-session knowledge graph with hybrid search, typed connections and artifact storage."
# Hermes Agent 0.21.6 is the oldest release the plugin supports. The floor is
# one patch lower because Hermes reports itself as 0.21.5 when it cannot read
# its own version in time, and a higher floor would then refuse the install.
requires_hermes: ">=0.21.5"
requires_env: []
