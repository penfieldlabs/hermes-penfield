# Run the same checks as CI before each commit.
#
# Set up once after cloning:
#   pip install -r requirements-dev.txt
#   pre-commit install

repos:
  - repo: local
    hooks:
      - id: lint
        name: ruff check and format
        entry: make lint
        language: system
        types: [python]
        pass_filenames: false

      - id: typecheck
        name: mypy
        entry: make typecheck
        language: system
        types: [python]
        pass_filenames: false
